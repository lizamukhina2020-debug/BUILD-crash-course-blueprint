# After a push to website/, optionally triggers a Vercel production build via deploy hook.
# 1) Vercel → seedmind project → Settings → Git → Deploy Hooks → create hook for `main`
# 2) GitHub → repo → Settings → Secrets → Actions → add VERCEL_DEPLOY_HOOK_URL with the hook URL
# Also required once in Vercel: Settings → General → Root Directory = `website`

name: Trigger SeedMind website deploy
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/vercel-seedmind-website.yml'
  workflow_dispatch:

jobs:
  deploy-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Skip when deploy hook secret is not configured
        if: ${{ secrets.VERCEL_DEPLOY_HOOK_URL == '' }}
        run: echo "VERCEL_DEPLOY_HOOK_URL not set — skipping Vercel deploy hook."

      - name: POST Vercel deploy hook
        if: ${{ secrets.VERCEL_DEPLOY_HOOK_URL != '' }}
        run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
